[settings]
idiomatic_version_file_enable_tools = ["node"]
node.corepack = true

[tools]
go = "1.26.4"
jq = "latest"
# pnpm/yarn precede node so mise binaries win over node's corepack shims on PATH
pnpm = "11"
yarn = "1.22.22"
node = "22"
"npm:eslint" = "latest"
ruby = "3.3.0"
terraform = "1.10.0"

# Global npm packages (formerly `npm install -g`)
"npm:@alibaba-group/open-code-review" = "latest"
"npm:@biomejs/biome" = "latest"
"npm:@northflank/cli" = "latest"
"npm:@playwright/cli" = "latest"
"npm:atlassian-axi" = "latest"
"npm:chrome-devtools-axi" = "latest"
"npm:gh-axi" = "latest"
"npm:glab-axi" = "latest"
"npm:nx" = "22"
"npm:quota-axi" = "latest"
"npm:swagger2openapi" = "latest"
"npm:tasks-axi" = "latest"
